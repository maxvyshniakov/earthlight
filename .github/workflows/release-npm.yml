name: Release to npm
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: maxvyshniakov/package-kit/actions/setup-bun@v1.0.1
      - run: bun run check && bun run build
  publish:
    name: Publish to npmjs.org
    needs: [check]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: npm install --global "npm@11.19.1"
      - name: Publish with provenance
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::Missing id-token: write permission for npm trusted publishing."
            exit 1
          fi
          npm publish --provenance --access public --userconfig=/dev/null
          VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          if ! git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            GIT_COMMITTER_NAME="github-actions[bot]" \
            GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            git tag -a "v${VERSION}" -m "earthlight ${VERSION}"
            git push origin "v${VERSION}"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
